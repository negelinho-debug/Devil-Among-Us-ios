name: Check Devil Among Us 2.3.0

on: workflow_dispatch

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and inspect version 2.3.0
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.mediafire.com/file/tyepiabex5stqkw/STTDAU+V2.3.rar/file'
          curl -fsSL --retry 2 --proto '=https' --proto-redir '=https' "$page" -o mediafire.html

          archive_url=$(python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class DownloadLink(HTMLParser):
              url = ""

              def handle_starttag(self, tag, attributes):
                  attrs = dict(attributes)
                  if tag == "a" and attrs.get("id") == "downloadButton":
                      self.url = attrs.get("href") or ""

          parser = DownloadLink()
          parser.feed(Path("mediafire.html").read_text(encoding="utf-8", errors="replace"))
          url = urlsplit(parser.url)
          host = url.hostname or ""
          if url.scheme != "https" or not (host == "mediafire.com" or host.endswith(".mediafire.com")):
              raise SystemExit("MediaFire did not provide a direct HTTPS download link.")
          print(parser.url)
          PY
          )

          archive="devil-among-us-2.3.rar"
          curl -fsSL --retry 2 --proto '=https' --proto-redir '=https' "$archive_url" -o "$archive"

          python3 - "$archive" <<'PY'
          import sys

          with open(sys.argv[1], "rb") as archive:
              header = archive.read(8)
          if not header.startswith((b"Rar!\x1a\x07\x00", b"Rar!\x1a\x07\x01\x00")):
              raise SystemExit("The download is not a RAR archive. MediaFire may have served an HTML page.")
          PY

          file "$archive"
          du -h "$archive"
          7z l "$archive" > archive-list.txt
          grep -Ei 'Assembly-CSharp|GameAssembly|MonoBleedingEdge|globalgamemanagers|UnityPlayer|ProjectVersion|StreamingAssets|localiz' \
            archive-list.txt || sed -n '1,70p' archive-list.txt
